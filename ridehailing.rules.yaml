app: ridehailing
state: idea
rules:
  - id: REQ-1
    statement: WHEN a rider requests a ride, THE SYSTEM SHALL show the fare estimate before the request is confirmed.
    status: confirmed
    revision: 1
    required: true
    rationale: Standard practice; avoids surprise charges.
    source:
      kind: stakeholder
      ref: "app owner, chat review 2026-11-04"
    decided_by: app owner (chandrafirst67)
    decided_on: 2026-11-04
    scenarios:
      - kind: required
        name: estimate shown
        given: rider picked pickup and destination
        when: rider opens the request screen
        then: estimated fare is shown before they can confirm
      - kind: forbidden
        name: confirm without estimate
        given: fare estimate unavailable
        when: rider tries to confirm
        then: request is blocked, not sent with an unknown fare

  - id: REQ-2
    statement: WHEN a rider already has an active ride, THE SYSTEM SHALL reject a second ride request from that rider.
    status: confirmed
    revision: 1
    required: true
    rationale: Prevents duplicate or overlapping trips; may be too strict (e.g. booking for a friend).
    source:
      kind: stakeholder
      ref: "app owner, chat review 2026-11-04"
    decided_by: app owner (chandrafirst67)
    decided_on: 2026-11-04
    scenarios:
      - kind: required
        name: first request accepted
        given: rider has no active ride
        when: rider requests a ride
        then: request is created
      - kind: forbidden
        name: duplicate request
        given: rider has an active ride
        when: rider requests another
        then: rejected, existing ride unchanged

  - id: MATCH-1
    statement: THE SYSTEM SHALL NOT offer one ride request to more than one driver at the same time.
    status: confirmed
    revision: 1
    required: true
    rationale: Avoids two drivers accepting the same ride. Uber-style sequential dispatch.
    source:
      kind: stakeholder
      ref: "app owner, chat review 2026-11-04"
    decided_by: app owner (chandrafirst67)
    decided_on: 2026-11-04
    scenarios:
      - kind: required
        name: sequential offers
        given: three nearby drivers
        when: first driver declines or times out
        then: offer goes to the next driver
      - kind: forbidden
        name: double accept
        given: two drivers see the same request
        when: both accept
        then: only one is assigned

  - id: CANCEL-1
    statement: WHEN a rider cancels before a driver accepts, or within a short grace period of 2 minutes after a driver accepts, THE SYSTEM SHALL charge no cancellation fee. The grace period length SHALL be a configuration value, not hard-coded.
    status: confirmed
    revision: 1
    required: true
    rationale: Modelled on Uber's typical policy. The grace length is an assumption; Uber varies it by market.
    source:
      kind: stakeholder
      ref: "app owner, chat 2026-11-05 (grace period 2 minutes, configurable)"
    decided_by: app owner (chandrafirst67)
    decided_on: 2026-11-05
    scenarios:
      - kind: required
        name: free cancel before acceptance
        given: no driver has accepted the request
        when: rider cancels
        then: request is cancelled and no fee is charged
      - kind: required
        name: free cancel inside grace period
        given: a driver accepted less than the grace period ago
        when: rider cancels
        then: no fee is charged
      - kind: forbidden
        name: fee inside free window
        given: no driver assigned, or still inside the grace period
        when: rider cancels
        then: any fee is charged

  - id: CANCEL-2
    statement: WHEN a rider cancels after the grace period once a driver is assigned, THE SYSTEM SHALL charge a flat cancellation fee of $5, paid to the driver, and show the fee to the rider before they confirm the cancel. The fee amount SHALL be a configuration value, not hard-coded.
    status: confirmed
    revision: 1
    required: true
    rationale: Modelled on Uber's typical policy. The fee amount and whether it varies by market are not decided.
    source:
      kind: stakeholder
      ref: "app owner, chat 2026-11-05 (flat $5, configurable)"
    decided_by: app owner (chandrafirst67)
    decided_on: 2026-11-05
    scenarios:
      - kind: required
        name: late cancel fee
        given: driver assigned and grace period has passed
        when: rider confirms the cancel
        then: flat fee is charged and credited to the driver
      - kind: forbidden
        name: hidden fee
        given: a fee will apply
        when: rider taps cancel
        then: cancel completes without first showing the fee

  - id: PAY-1
    statement: WHEN a rider requests a ride, THE SYSTEM SHALL verify the payment method and hold the estimated fare, and WHEN the trip ends, THE SYSTEM SHALL charge the final fare.
    status: confirmed
    revision: 1
    required: true
    rationale: Modelled on Uber's typical flow (pre-authorize at request, charge at end of trip). Not decided whether a hold or only a card check is used.
    source:
      kind: stakeholder
      ref: "app owner, chat 2026-11-05 (confirmed as proposed; values configurable)"
    decided_by: app owner (chandrafirst67)
    decided_on: 2026-11-05
    scenarios:
      - kind: required
        name: charge at trip end
        given: trip completed with a valid payment method
        when: trip ends
        then: final fare is charged once
      - kind: forbidden
        name: double charge
        given: trip completed and already charged
        when: charge is retried
        then: rider is charged a second time

  - id: PAY-2
    statement: WHEN a rider's payment fails, THE SYSTEM SHALL record an outstanding balance on the rider and block new ride requests until it is paid, and THE SYSTEM SHALL still pay the driver in full.
    status: confirmed
    revision: 1
    required: true
    rationale: Platform bears the loss; matches Uber, Grab and Gojek. Decided 2026-11-05.
    source:
      kind: stakeholder
      ref: "app owner, chat 2026-11-05"
    decided_by: app owner (chandrafirst67)
    decided_on: 2026-11-05
    scenarios:
      - kind: required
        name: block after failed payment
        given: rider has an unpaid balance
        when: rider requests a ride
        then: request is rejected with a prompt to pay
      - kind: forbidden
        name: driver unpaid
        given: rider payment failed
        when: trip is settled
        then: driver receives nothing
  - id: CANCEL-3
    statement: WHEN the driver has arrived and the rider has not shown up within 5 minutes, THE SYSTEM SHALL let the driver cancel and charge the rider the same flat fee as CANCEL-2 ($5), credited to the driver. The waiting time and fee SHALL be configuration values.
    status: confirmed
    revision: 1
    required: true
    rationale: Same fee as CANCEL-2. Decided 2026-11-05.
    source:
      kind: stakeholder
      ref: "app owner, chat 2026-11-05"
    decided_by: app owner (chandrafirst67)
    decided_on: 2026-11-05
    scenarios:
      - kind: required
        name: no-show fee
        given: driver arrived and waiting time has passed
        when: driver cancels as no-show
        then: rider is charged the fee, credited to the driver
      - kind: forbidden
        name: early no-show
        given: driver arrived and waiting time has not passed
        when: driver cancels as no-show
        then: rider is charged
  - id: SAFE-1
    statement: THE SYSTEM SHALL NOT offer rides to a driver unless the driver has a valid driver license, valid vehicle documents (registration, insurance, inspection), a passed background check, and an ID and photo match (re-checked by selfie on login).
    status: confirmed
    revision: 1
    required: true
    rationale: Rider safety. Decided 2026-11-05.
    source:
      kind: stakeholder
      ref: "app owner, chat 2026-11-05"
    decided_by: app owner (chandrafirst67)
    decided_on: 2026-11-05
    scenarios:
      - kind: required
        name: verified driver activated
        given: driver has a valid license, vehicle documents, a passed background check and a matching ID/photo
        when: driver goes online
        then: driver can receive ride offers
      - kind: required
        name: selfie match on login
        given: an activated driver logs in
        when: the selfie does not match the ID photo
        then: driver cannot go online
      - kind: forbidden
        name: unverified driver gets rides
        given: any of license, vehicle documents, background check or ID/photo match is missing, failed or expired
        when: driver goes online
        then: driver receives a ride offer

  - id: FARE-1
    statement: THE SYSTEM SHALL charge the rider exactly the upfront fare shown before the request was confirmed (REQ-1), unless the rider changes the destination or route, or an exception rule says otherwise.
    status: proposed
    revision: 1
    rationale: Owner chose an upfront fixed price (Uber-style) on 2026-11-05. Exceptions (destination change, extra stops, tolls, long waits) are not decided. Complements REQ-1 and PAY-1.
    source:
      kind: stakeholder
      ref: "app owner, chat 2026-11-05 (upfront fixed price)"
    depends_on: [REQ-1, PAY-1]
    scenarios:
      - kind: required
        name: charged the estimate
        given: rider confirmed a ride with an upfront fare and made no changes
        when: trip ends
        then: rider is charged exactly the upfront fare
      - kind: forbidden
        name: surprise overcharge
        given: no destination or route change
        when: trip takes longer or is longer than estimated
        then: rider is charged more than the upfront fare
